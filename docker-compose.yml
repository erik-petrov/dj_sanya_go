# Full stack — one command brings up the bot + Lavalink + cipher + STT:
#
#   git submodule update --init --recursive   # fetch the discordgo DAVE fork
#   docker compose up -d --build
#
# Requires: .env (BOT_TOKEN, EARS_BOT_TOKEN, SPOTIFY_*, ...) and
# lavalink/application.yml. Service names are the hostnames on the compose
# network (bot -> lavalink:2333, lavalink -> http://bgutil:4416 for yt-dlp
# poTokens, bot -> http://stt:8000); nothing is exposed to the host.

services:
  # Remote cipher server for the youtube-source plugin. NOTE: now unused —
  # YouTube goes through yt-dlp (LavaSrc), not youtube-source. Kept only so the
  # rollback path (re-enable youtube-source) works without editing compose.
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    container_name: yt-cipher
    restart: unless-stopped
    environment:
      # Only the IAS variant works reliably right now (per yt-cipher docs).
      - OVERRIDE_PLAYER_VARIANT=IAS
      # yt-cipher's port is NOT published to the host, so it is only reachable
      # from inside this compose network and auth is optional. To require it,
      # uncomment below and set remoteCipher.password in application.yml to match:
      # - API_TOKEN=changeme

  # BotGuard poToken provider. yt-dlp (inside the Lavalink container, via the
  # bgutil-ytdlp-pot-provider plugin) calls this to mint poTokens so YouTube
  # streams past the bot check. Port 4416 stays on the compose network.
  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider
    container_name: bgutil
    restart: unless-stopped

  # Lavalink audio node. Built locally (lavalink/Dockerfile) to bake in yt-dlp,
  # which LavaSrc uses to resolve YouTube (handles SABR + poToken via bgutil).
  # Auto-downloads the Lavalink plugins pinned in application.yml on startup.
  lavalink:
    build: ./lavalink
    image: dj_sanya_lavalink
    container_name: lavalink
    restart: unless-stopped
    depends_on:
      - bgutil # yt-dlp pulls poTokens from the bgutil provider
    environment:
      - _JAVA_OPTIONS=-Xmx1G # cap heap; raise if you see OOM
      # LavaSrc reads these for Spotify (interpolated from the repo-root .env).
      - SPOTIFY_ID=${SPOTIFY_ID}
      - SPOTIFY_SECRET=${SPOTIFY_SECRET}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      # YouTube auth cookies (Netscape format) for yt-dlp. An authenticated
      # session authorizes the googlevideo stream request that a bare poToken
      # still 403s on a flagged IP. Read-only to avoid concurrent-write races;
      # re-export when it expires. Must be world-readable (chmod 644).
      - ./cookies.txt:/etc/yt-dlp/cookies.txt:ro

  # Speech-to-text sidecar (faster-whisper, Russian) for voice commands.
  stt:
    build: ./stt
    container_name: stt
    restart: unless-stopped
    environment:
      - STT_ENGINE=gigaam    # gigaam (Russian, CPU) | whisper (fallback)
      - GIGAAM_MODEL=v2_ctc  # v2_ctc fastest; v3_ctc / v3_rnnt if your gigaam ships v3
      - WHISPER_MODEL=base   # only used when STT_ENGINE=whisper
    volumes:
      - whisper-cache:/root/.cache # persist downloaded models across restarts

  # The Discord bot. It connects out to Discord and to the lavalink service.
  dj_sanya_go:
    build: . # build the local code (the published image lacks the Lavalink work)
    image: koteman123/dj_sanya_go:${VERSION:-latest}
    container_name: sanya
    restart: unless-stopped
    depends_on:
      - lavalink
      - stt
      - bgutil
    env_file: ".env" # BOT_TOKEN, EARS_BOT_TOKEN, SPOTIFY_*, etc.
    environment:
      - LAVALINK_ADDRESS=lavalink:2333
      - LAVALINK_PASSWORD=youshallnotpass # must match server.password in application.yml
      - LAVALINK_SECURE=false
      # POT_PROVIDER_URL intentionally unset: YouTube now goes through yt-dlp
      # (inside Lavalink), which talks to bgutil directly, so the bot's old
      # push-poToken-to-youtube-source loop (potoken.go) is dormant.
      - STT_URL=http://stt:8000
      - SC_BOT_ALLOWLIST=TTS Bot#3590 # bots to still transcribe (id / name / name#disc, comma-sep); all other bots ignored
      - BAN_FILE=/data/banned.json # persisted ban list (OWNER_IDS in .env controls /ban)
      - WEB_ADDR=:8080 # web control panel (needs WEB_BASE_URL + DISCORD_CLIENT_ID/SECRET in .env)
    ports:
      - "127.0.0.1:6777:8080" # web panel — reverse-proxy your domain to this
    volumes:
      - bandata:/data # persist the ban list across restarts/recreation

volumes:
  whisper-cache:
  bandata:
